<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Test</title>

<style>

@font-face {
    font-family: "8BitOperator";
    src: url("https://deltarune.com/assets/fonts/8bitOperatorPlus-Bold.woff");
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: black;
    color: white;
    font-family: "8BitOperator", monospace;
    overflow: hidden;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: black;
    overflow: hidden;
    image-rendering: pixelated;
}


/* =========================
   PLAYER HEART
   ========================= */

#player {
    position: absolute;

    width: 40px;
    height: 40px;

    object-fit: contain;
    image-rendering: pixelated;

    z-index: 10;

    background: transparent;
    border: none;
    box-shadow: none;

    /*
       images.png has a black area around
       the red heart. Screen blending makes
       that black area disappear against the
       black game background.
    */
    mix-blend-mode: screen;
}


/* =========================
   OBJECT
   ========================= */

#object {
    position: absolute;

    width: 100px;
    height: 100px;

    left: 500px;
    top: 250px;

    background: #222;

    border: 4px solid white;

    z-index: 2;
}


/* =========================
   INTERACTION HEART
   ========================= */

#interaction-heart {
    position: absolute;

    width: 20px;
    height: 20px;

    object-fit: contain;
    image-rendering: pixelated;

    display: none;

    pointer-events: none;

    z-index: 20;

    mix-blend-mode: screen;
}


/* =========================
   CONTROLS
   ========================= */

#hint {
    position: absolute;

    top: 20px;
    left: 20px;

    color: #aaa;

    font-size: 14px;

    z-index: 50;
}


/* =========================
   DIALOGUE BOX
   ========================= */

#dialogue {
    position: absolute;

    left: 50%;
    bottom: 30px;

    transform: translateX(-50%);

    width: 80%;
    min-height: 150px;

    padding: 25px 30px;

    background: black;

    border: 4px solid white;

    display: none;

    z-index: 100;

    cursor: pointer;
}

#speaker {
    font-size: 20px;
    margin-bottom: 18px;
}

#text {
    font-size: 20px;
    line-height: 1.5;
}

</style>
</head>


<body>

<div id="game">

    <div id="hint">
        WASD: MOVE &nbsp;&nbsp; E / SPACE: INTERACT
    </div>


    <!--
        THIS IS NOW THE ACTUAL PLAYER.

        The heart itself moves around the screen.
    -->

    <img
        id="player"
        src="https://raw.githubusercontent.com/ngonguyenminhhai-wq/Sound-effect/main/images.png"
        alt=""
    >


    <!-- Object that the player can interact with -->

    <div id="object"></div>


    <!-- Small heart that appears when near the object -->

    <img
        id="interaction-heart"
        src="https://raw.githubusercontent.com/ngonguyenminhhai-wq/Sound-effect/main/images.png"
        alt=""
    >


    <!-- Dialogue -->

    <div id="dialogue">

        <div id="speaker">
            OBJECT
        </div>

        <div id="text"></div>

    </div>

</div>


<script>

/* =========================
   ELEMENTS
   ========================= */

const player = document.getElementById("player");

const object = document.getElementById("object");

const interactionHeart =
    document.getElementById("interaction-heart");

const dialogue =
    document.getElementById("dialogue");

const textBox =
    document.getElementById("text");

const game =
    document.getElementById("game");


/* =========================
   PLAYER SETTINGS
   ========================= */

let playerX = 200;
let playerY = 200;

const playerSpeed = 4;

const keys = {};


/* =========================
   DIALOGUE SETTINGS
   ========================= */

let talking = false;

let dialogueIndex = 0;

const dialogueLines = [

    "You found something.",

    "It's just a strange box.",

    "You don't know what it does."

];


/* =========================
   KEYBOARD INPUT
   ========================= */

document.addEventListener("keydown", function(event) {

    const key = event.key.toLowerCase();

    keys[key] = true;


    /* Prevent Space from scrolling the page */

    if (event.key === " ") {
        event.preventDefault();
    }


    /* E or Space */

    if (
        key === "e" ||
        event.key === " "
    ) {

        if (talking) {

            advanceDialogue();

        } else {

            tryInteract();

        }

    }

});


document.addEventListener("keyup", function(event) {

    keys[event.key.toLowerCase()] = false;

});


/* =========================
   MOVEMENT
   ========================= */

function updateMovement() {

    /*
       Don't allow movement while talking.
    */

    if (talking) {
        return;
    }


    /* WASD */

    if (keys["w"]) {
        playerY -= playerSpeed;
    }

    if (keys["s"]) {
        playerY += playerSpeed;
    }

    if (keys["a"]) {
        playerX -= playerSpeed;
    }

    if (keys["d"]) {
        playerX += playerSpeed;
    }


    /*
       Keep the heart inside the screen.
    */

    const maxX =
        game.clientWidth - player.offsetWidth;

    const maxY =
        game.clientHeight - player.offsetHeight;


    playerX =
        Math.max(
            0,
            Math.min(playerX, maxX)
        );


    playerY =
        Math.max(
            0,
            Math.min(playerY, maxY)
        );


    /*
       Actually move the PNG.
    */

    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";

}


/* =========================
   DISTANCE TO OBJECT
   ========================= */

function getDistance() {

    const playerCenterX =
        playerX +
        player.offsetWidth / 2;

    const playerCenterY =
        playerY +
        player.offsetHeight / 2;


    const objectCenterX =
        object.offsetLeft +
        object.offsetWidth / 2;

    const objectCenterY =
        object.offsetTop +
        object.offsetHeight / 2;


    const dx =
        playerCenterX -
        objectCenterX;

    const dy =
        playerCenterY -
        objectCenterY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================
   INTERACTION INDICATOR
   ========================= */

function updateInteraction() {

    /*
       Hide the small heart while talking.
    */

    if (talking) {

        interactionHeart.style.display =
            "none";

        return;
    }


    const distance =
        getDistance();


    /*
       Show it when close enough.
    */

    if (distance < 120) {

        interactionHeart.style.display =
            "block";


        interactionHeart.style.left =
            (
                object.offsetLeft +
                object.offsetWidth / 2 -
                10
            ) + "px";


        interactionHeart.style.top =
            (
                object.offsetTop -
                30
            ) + "px";


    } else {

        interactionHeart.style.display =
            "none";

    }

}


/* =========================
   INTERACT
   ========================= */

function tryInteract() {

    const distance =
        getDistance();


    if (distance < 120) {

        startDialogue();

    }

}


/* =========================
   START DIALOGUE
   ========================= */

function startDialogue() {

    talking = true;

    dialogueIndex = 0;


    dialogue.style.display =
        "block";


    interactionHeart.style.display =
        "none";


    showDialogueLine();

}


/* =========================
   SHOW DIALOGUE
   ========================= */

function showDialogueLine() {

    textBox.textContent =
        dialogueLines[dialogueIndex];

}


/* =========================
   NEXT DIALOGUE
   ========================= */

function advanceDialogue() {

    dialogueIndex++;


    /*
       If there are no more lines,
       close the dialogue.
    */

    if (
        dialogueIndex >=
        dialogueLines.length
    ) {

        closeDialogue();

        return;

    }


    showDialogueLine();

}


/* =========================
   CLOSE DIALOGUE
   ========================= */

function closeDialogue() {

    talking = false;

    dialogue.style.display =
        "none";

}


/* =========================
   CLICK DIALOGUE
   ========================= */

dialogue.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();


        if (talking) {

            advanceDialogue();

        }

    }
);


/* =========================
   GAME LOOP
   ========================= */

function gameLoop() {

    updateMovement();

    updateInteraction();

    requestAnimationFrame(gameLoop);

}


/* =========================
   START GAME
   ========================= */

gameLoop();

</script>

</body>
</html>
