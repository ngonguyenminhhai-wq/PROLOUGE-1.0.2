<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Test</title>

<style>

@font-face {
    font-family: "8BitOperator";
    src: url("https://deltarune.com/assets/fonts/8bitOperatorPlus-Bold.woff");
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

body {
    color: white;
    font-family: "8BitOperator", monospace;
}


/* =========================================================
   GAME
   ========================================================= */

#game {
    position: relative;

    width: 100vw;
    height: 100vh;

    background: black;

    overflow: hidden;

    image-rendering: pixelated;
}


/* =========================================================
   ROOM
   ========================================================= */

#room {
    position: absolute;

    /*
       This is the actual area the SOUL can walk inside.
    */

    left: 5vw;
    top: 5vh;

    width: 90vw;
    height: 75vh;

    border: 5px solid white;

    background: black;

    overflow: hidden;
}


/* =========================================================
   ROOM NAME
   ========================================================= */

#room-name {
    position: absolute;

    top: 15px;
    left: 20px;

    font-size: 18px;

    color: white;

    z-index: 50;

    pointer-events: none;
}


/* =========================================================
   PLAYER / SOUL
   ========================================================= */

#player {
    position: absolute;

    width: 40px;
    height: 40px;

    object-fit: contain;

    image-rendering: pixelated;

    background: transparent;

    border: none;

    box-shadow: none;

    /*
       Your PNG is used directly as the player.

       Screen blending makes any black surrounding
       area blend into the black room.
    */

    mix-blend-mode: screen;

    z-index: 20;
}


/* =========================================================
   OBJECTS
   ========================================================= */

.object {
    position: absolute;

    background: #222;

    border: 4px solid white;

    z-index: 5;
}


/* =========================================================
   INTERACTION HEART
   ========================================================= */

.interaction-heart {
    position: absolute;

    width: 24px;
    height: 24px;

    object-fit: contain;

    image-rendering: pixelated;

    background: transparent;

    border: none;

    display: none;

    pointer-events: none;

    z-index: 30;

    mix-blend-mode: screen;
}


/* =========================================================
   ROOM EXIT
   ========================================================= */

.exit {
    position: absolute;

    width: 80px;
    height: 50px;

    border: 4px solid white;

    background: black;

    z-index: 4;
}

.exit-label {
    position: absolute;

    width: 100%;

    text-align: center;

    top: 12px;

    font-size: 13px;

    pointer-events: none;
}


/* =========================================================
   CONTROLS
   ========================================================= */

#hint {
    position: absolute;

    left: 5vw;
    top: calc(5vh + 75vh + 20px);

    color: #aaa;

    font-size: 14px;

    z-index: 50;
}


/* =========================================================
   DIALOGUE
   ========================================================= */

#dialogue {
    position: absolute;

    left: 50%;
    bottom: 30px;

    transform: translateX(-50%);

    width: 80%;

    min-height: 150px;

    padding: 25px 30px;

    background: black;

    border: 4px solid white;

    display: none;

    z-index: 100;

    cursor: pointer;
}

#speaker {
    font-size: 20px;

    margin-bottom: 18px;
}

#text {
    font-size: 20px;

    line-height: 1.5;
}


/* =========================================================
   ROOM TRANSITION MESSAGE
   ========================================================= */

#transition {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    color: white;

    font-size: 24px;

    display: none;

    z-index: 200;

    background: black;

    padding: 20px;
}

</style>
</head>


<body>

<div id="game">

    <!-- =====================================================
         ROOM
         ===================================================== -->

    <div id="room">

        <div id="room-name">
            ROOM 1
        </div>

        <!-- Objects are generated by JavaScript -->

    </div>


    <!-- =====================================================
         CONTROLS
         ===================================================== -->

    <div id="hint">
        WASD: MOVE &nbsp;&nbsp; E / SPACE: INTERACT
    </div>


    <!-- =====================================================
         DIALOGUE
         ===================================================== -->

    <div id="dialogue">

        <div id="speaker">
            OBJECT
        </div>

        <div id="text"></div>

    </div>


    <!-- =====================================================
         ROOM TRANSITION
         ===================================================== -->

    <div id="transition">
        ROOM 2
    </div>

</div>


<script>


/* =========================================================
   IMAGE
   ========================================================= */

const SOUL_IMAGE =
    "https://raw.githubusercontent.com/ngonguyenminhhai-wq/Sound-effect/main/background-remover-1791003659354.png";


/* =========================================================
   ELEMENTS
   ========================================================= */

const game =
    document.getElementById("game");

const room =
    document.getElementById("room");

const roomName =
    document.getElementById("room-name");

const dialogue =
    document.getElementById("dialogue");

const speaker =
    document.getElementById("speaker");

const textBox =
    document.getElementById("text");

const transition =
    document.getElementById("transition");


/* =========================================================
   PLAYER
   ========================================================= */

const player =
    document.createElement("img");

player.id = "player";

player.src = SOUL_IMAGE;

player.alt = "";

room.appendChild(player);


/* =========================================================
   INTERACTION HEART
   ========================================================= */

const interactionHeart =
    document.createElement("img");

interactionHeart.className =
    "interaction-heart";

interactionHeart.src =
    SOUL_IMAGE;

interactionHeart.alt = "";

room.appendChild(interactionHeart);


/* =========================================================
   ROOM DATA
   =========================================================

   This is the part you can easily expand later.

   Every room can have as many objects as you want.
   ========================================================= */

const rooms = {


    /* =====================================================
       ROOM 1
       ===================================================== */

    room1: {

        name: "ROOM 1",

        startX: 120,
        startY: 150,

        objects: [

            {
                id: "box1",

                x: 550,
                y: 250,

                width: 100,
                height: 100,

                name: "BOX",

                dialogue: [

                    "You found something.",

                    "It's a strange box.",

                    "You don't know what it does."

                ]

            }

        ],

        exit: {

            x: 800,
            y: 500,

            width: 80,
            height: 50,

            target: "room2"

        }

    },


    /* =====================================================
       ROOM 2
       ===================================================== */

    room2: {

        name: "ROOM 2",

        startX: 120,
        startY: 150,

        objects: [

            {

                id: "box2",

                x: 300,
                y: 250,

                width: 100,
                height: 100,

                name: "BOX",

                dialogue: [

                    "There is another box.",

                    "This one looks older."

                ]

            },


            {

                id: "box3",

                x: 600,
                y: 350,

                width: 100,
                height: 100,

                name: "BOX",

                dialogue: [

                    "You found a second object.",

                    "It feels strangely familiar."

                ]

            }

        ],

        exit: {

            x: 800,
            y: 500,

            width: 80,
            height: 50,

            target: "room1"

        }

    }

};


/* =========================================================
   CURRENT ROOM
   ========================================================= */

let currentRoom = "room1";


/* =========================================================
   PLAYER POSITION
   ========================================================= */

let playerX = 120;
let playerY = 150;

const playerSpeed = 4;


/* =========================================================
   KEYS
   ========================================================= */

const keys = {};


/* =========================================================
   GAME STATE
   ========================================================= */

let talking = false;

let dialogueIndex = 0;

let currentDialogue = [];

let currentSpeaker = "OBJECT";


/* =========================================================
   ROOM OBJECT ELEMENTS
   ========================================================= */

let objectElements = [];

let exitElement = null;


/* =========================================================
   KEY DOWN
   ========================================================= */

document.addEventListener("keydown", function(event) {

    const key =
        event.key.toLowerCase();


    keys[key] = true;


    /*
       Prevent Space from scrolling.
    */

    if (event.key === " ") {

        event.preventDefault();

    }


    /*
       E / Space interaction.
    */

    if (
        key === "e" ||
        event.key === " "
    ) {

        if (talking) {

            advanceDialogue();

        } else {

            tryInteract();

        }

    }

});


/* =========================================================
   KEY UP
   ========================================================= */

document.addEventListener("keyup", function(event) {

    keys[event.key.toLowerCase()] = false;

});


/* =========================================================
   CREATE ROOM
   ========================================================= */

function loadRoom(roomID) {

    currentRoom = roomID;

    const data =
        rooms[currentRoom];


    /*
       Remove previous objects.
    */

    for (const element of objectElements) {

        element.remove();

    }

    objectElements = [];


    /*
       Remove old exit.
    */

    if (exitElement) {

        exitElement.remove();

        exitElement = null;

    }


    /*
       Update room name.
    */

    roomName.textContent =
        data.name;


    /*
       Create objects.
    */

    data.objects.forEach(function(objectData) {

        const element =
            document.createElement("div");

        element.className =
            "object";

        element.dataset.objectId =
            objectData.id;


        element.style.left =
            objectData.x + "px";

        element.style.top =
            objectData.y + "px";

        element.style.width =
            objectData.width + "px";

        element.style.height =
            objectData.height + "px";


        room.appendChild(element);

        objectElements.push(element);

    });


    /*
       Create exit.
    */

    exitElement =
        document.createElement("div");

    exitElement.className =
        "exit";


    exitElement.style.left =
        data.exit.x + "px";

    exitElement.style.top =
        data.exit.y + "px";

    exitElement.style.width =
        data.exit.width + "px";

    exitElement.style.height =
        data.exit.height + "px";


    const exitLabel =
        document.createElement("div");

    exitLabel.className =
        "exit-label";

    exitLabel.textContent =
        "EXIT";


    exitElement.appendChild(exitLabel);

    room.appendChild(exitElement);


    /*
       Put the player at the room's
       starting position.
    */

    playerX =
        data.startX;

    playerY =
        data.startY;


    updatePlayerPosition();

}


/* =========================================================
   PLAYER POSITION
   ========================================================= */

function updatePlayerPosition() {

    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";

}


/* =========================================================
   COLLISION RECTANGLE
   ========================================================= */

function getPlayerRect(x, y) {

    return {

        left: x,

        top: y,

        right:
            x +
            player.offsetWidth,

        bottom:
            y +
            player.offsetHeight

    };

}


/* =========================================================
   RECTANGLE COLLISION
   ========================================================= */

function rectanglesOverlap(a, b) {

    return (

        a.left < b.right &&

        a.right > b.left &&

        a.top < b.bottom &&

        a.bottom > b.top

    );

}


/* =========================================================
   OBJECT RECTANGLE
   ========================================================= */

function getObjectRect(element) {

    return {

        left:
            element.offsetLeft,

        top:
            element.offsetTop,

        right:
            element.offsetLeft +
            element.offsetWidth,

        bottom:
            element.offsetTop +
            element.offsetHeight

    };

}


/* =========================================================
   CAN MOVE TO POSITION
   ========================================================= */

function canMoveTo(x, y) {

    const playerRect =
        getPlayerRect(x, y);


    /*
       Room boundaries.

       The player must remain completely
       inside the white border.
    */

    const roomWidth =
        room.clientWidth;

    const roomHeight =
        room.clientHeight;


    if (playerRect.left < 5) {

        return false;

    }


    if (
        playerRect.top < 5
    ) {

        return false;

    }


    if (
        playerRect.right >
        roomWidth - 5
    ) {

        return false;

    }


    if (
        playerRect.bottom >
        roomHeight - 5
    ) {

        return false;

    }


    /*
       Check every object.
    */

    for (
        const element
        of objectElements
    ) {

        const objectRect =
            getObjectRect(element);


        if (
            rectanglesOverlap(
                playerRect,
                objectRect
            )
        ) {

            return false;

        }

    }


    return true;

}


/* =========================================================
   MOVEMENT
   ========================================================= */

function updateMovement() {

    if (talking) {

        return;

    }


    let newX =
        playerX;

    let newY =
        playerY;


    /*
       Horizontal movement.
    */

    if (keys["a"]) {

        newX -= playerSpeed;

    }

    if (keys["d"]) {

        newX += playerSpeed;

    }


    /*
       Test horizontal movement
       separately.

       This means you can slide along
       the side of an object.
    */

    if (
        canMoveTo(
            newX,
            playerY
        )
    ) {

        playerX =
            newX;

    }


    /*
       Vertical movement.
    */

    if (keys["w"]) {

        newY -= playerSpeed;

    }

    if (keys["s"]) {

        newY += playerSpeed;

    }


    /*
       Test vertical movement.
    */

    if (
        canMoveTo(
            playerX,
            newY
        )
    ) {

        playerY =
            newY;

    }


    updatePlayerPosition();

}


/* =========================================================
   DISTANCE BETWEEN PLAYER AND OBJECT
   ========================================================= */

function getDistanceToObject(
    objectElement
) {

    const playerCenterX =
        playerX +
        player.offsetWidth / 2;

    const playerCenterY =
        playerY +
        player.offsetHeight / 2;


    const objectCenterX =
        objectElement.offsetLeft +
        objectElement.offsetWidth / 2;

    const objectCenterY =
        objectElement.offsetTop +
        objectElement.offsetHeight / 2;


    const dx =
        playerCenterX -
        objectCenterX;

    const dy =
        playerCenterY -
        objectCenterY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   FIND NEAREST OBJECT
   ========================================================= */

function getNearestObject() {

    let nearest = null;

    let nearestDistance =
        Infinity;


    objectElements.forEach(
        function(element, index) {

            const distance =
                getDistanceToObject(
                    element
                );


            if (
                distance <
                nearestDistance
            ) {

                nearestDistance =
                    distance;

                nearest = {

                    element:
                        element,

                    data:
                        rooms[
                            currentRoom
                        ].objects[index]

                };

            }

        }
    );


    return nearest;

}


/* =========================================================
   INTERACTION
   ========================================================= */

function updateInteraction() {

    if (talking) {

        interactionHeart.style.display =
            "none";

        return;

    }


    const nearest =
        getNearestObject();


    /*
       Object interaction distance.
    */

    if (
        nearest &&
        getDistanceToObject(
            nearest.element
        ) < 120
    ) {

        interactionHeart.style.display =
            "block";


        interactionHeart.style.left =
            (
                nearest.element.offsetLeft +
                nearest.element.offsetWidth / 2 -
                12
            ) + "px";


        interactionHeart.style.top =
            (
                nearest.element.offsetTop -
                32
            ) + "px";


        return;

    }


    /*
       Check the room exit.
    */

    if (
        exitElement &&
        isNearExit()
    ) {

        interactionHeart.style.display =
            "block";


        interactionHeart.style.left =
            (
                exitElement.offsetLeft +
                exitElement.offsetWidth / 2 -
                12
            ) + "px";


        interactionHeart.style.top =
            (
                exitElement.offsetTop -
                32
            ) + "px";


        return;

    }


    interactionHeart.style.display =
        "none";

}


/* =========================================================
   EXIT DISTANCE
   ========================================================= */

function isNearExit() {

    if (!exitElement) {

        return false;

    }


    const playerCenterX =
        playerX +
        player.offsetWidth / 2;

    const playerCenterY =
        playerY +
        player.offsetHeight / 2;


    const exitCenterX =
        exitElement.offsetLeft +
        exitElement.offsetWidth / 2;

    const exitCenterY =
        exitElement.offsetTop +
        exitElement.offsetHeight / 2;


    const dx =
        playerCenterX -
        exitCenterX;

    const dy =
        playerCenterY -
        exitCenterY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    return distance < 100;

}


/* =========================================================
   INTERACT
   ========================================================= */

function tryInteract() {

    /*
       First check objects.
    */

    const nearest =
        getNearestObject();


    if (
        nearest &&
        getDistanceToObject(
            nearest.element
        ) < 120
    ) {

        startDialogue(
            nearest.data.name,
            nearest.data.dialogue
        );

        return;

    }


    /*
       Then check the exit.
    */

    if (isNearExit()) {

        changeRoom();

    }

}


/* =========================================================
   START DIALOGUE
   ========================================================= */

function startDialogue(
    objectName,
    lines
) {

    talking = true;

    dialogueIndex = 0;

    currentDialogue =
        lines;

    currentSpeaker =
        objectName;


    speaker.textContent =
        currentSpeaker;


    dialogue.style.display =
        "block";


    interactionHeart.style.display =
        "none";


    showDialogueLine();

}


/* =========================================================
   SHOW DIALOGUE
   ========================================================= */

function showDialogueLine() {

    textBox.textContent =
        currentDialogue[
            dialogueIndex
        ];

}


/* =========================================================
   ADVANCE DIALOGUE
   ========================================================= */

function advanceDialogue() {

    dialogueIndex++;


    if (
        dialogueIndex >=
        currentDialogue.length
    ) {

        closeDialogue();

        return;

    }


    showDialogueLine();

}


/* =========================================================
   CLOSE DIALOGUE
   ========================================================= */

function closeDialogue() {

    talking = false;

    dialogue.style.display =
        "none";

}


/* =========================================================
   DIALOGUE CLICK
   ========================================================= */

dialogue.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        if (talking) {

            advanceDialogue();

        }

    }
);


/* =========================================================
   CHANGE ROOM
   ========================================================= */

function changeRoom() {

    const target =
        rooms[
            currentRoom
        ].exit.target;


    /*
       Small transition effect.
    */

    transition.textContent =
        rooms[target].name;

    transition.style.display =
        "block";


    setTimeout(function() {

        transition.style.display =
            "none";

        loadRoom(target);

    }, 250);

}


/* =========================================================
   GAME LOOP
   ========================================================= */

function gameLoop() {

    updateMovement();

    updateInteraction();

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   START
   ========================================================= */

loadRoom("room1");

gameLoop();


</script>

</body>
</html>
