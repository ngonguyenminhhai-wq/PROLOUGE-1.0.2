<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Room Test</title>

<style>

@font-face {
    font-family: "8BitOperator";
    src: url("https://deltarune.com/assets/fonts/8bitOperatorPlus-Bold.woff");
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

body {
    color: white;
    font-family: "8BitOperator", monospace;
}


/* =========================================================
   GAME
   ========================================================= */

#game {
    position: relative;

    width: 100vw;
    height: 100vh;

    background: black;

    overflow: hidden;
}


/* =========================================================
   ROOM
   ========================================================= */

#room {
    position: absolute;

    left: 5vw;
    top: 5vh;

    width: 90vw;
    height: 75vh;

    background: black;

    border: 6px solid white;

    overflow: hidden;
}


/* =========================================================
   ROOM NAME
   ========================================================= */

#room-name {
    position: absolute;

    left: 20px;
    top: 15px;

    font-size: 18px;

    z-index: 50;

    pointer-events: none;
}


/* =========================================================
   PLAYER / SOUL
   ========================================================= */

#player {
    position: absolute;

    width: 40px;
    height: 40px;

    object-fit: contain;

    image-rendering: pixelated;

    z-index: 20;

    pointer-events: none;

    /*
       Your PNG is the actual player.
    */

    background: transparent;

    border: none;

    box-shadow: none;

    mix-blend-mode: screen;
}


/* =========================================================
   OBJECT
   ========================================================= */

.object {
    position: absolute;

    background: #222;

    border: 4px solid white;

    z-index: 10;
}


/* =========================================================
   DOOR
   ========================================================= */

.door {
    position: absolute;

    width: 90px;
    height: 20px;

    background: black;

    border: 4px solid white;

    z-index: 8;
}


/*
   The door is deliberately placed over
   the bottom wall.
*/

.door-label {
    position: absolute;

    left: 50%;
    top: -30px;

    transform: translateX(-50%);

    font-size: 13px;

    white-space: nowrap;

    pointer-events: none;
}


/* =========================================================
   INTERACTION HEART
   ========================================================= */

#interaction-heart {
    position: absolute;

    width: 24px;
    height: 24px;

    object-fit: contain;

    image-rendering: pixelated;

    background: transparent;

    border: none;

    display: none;

    pointer-events: none;

    z-index: 40;

    mix-blend-mode: screen;
}


/* =========================================================
   CONTROLS
   ========================================================= */

#hint {
    position: absolute;

    left: 5vw;

    top: calc(5vh + 75vh + 20px);

    color: #aaa;

    font-size: 14px;

    z-index: 50;
}


/* =========================================================
   DIALOGUE
   ========================================================= */

#dialogue {
    position: absolute;

    left: 50%;
    bottom: 30px;

    transform: translateX(-50%);

    width: 80%;

    min-height: 150px;

    padding: 25px 30px;

    background: black;

    border: 4px solid white;

    display: none;

    z-index: 100;

    cursor: pointer;
}

#speaker {
    font-size: 20px;

    margin-bottom: 18px;
}

#text {
    font-size: 20px;

    line-height: 1.5;
}


/* =========================================================
   ROOM TRANSITION
   ========================================================= */

#transition {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    display: none;

    background: black;

    padding: 20px;

    font-size: 24px;

    z-index: 200;
}

</style>
</head>


<body>

<div id="game">

    <div id="room">

        <div id="room-name">
            ROOM 1
        </div>

        <img
            id="player"
            src="https://raw.githubusercontent.com/ngonguyenminhhai-wq/Sound-effect/main/background-remover-1791003659354.png"
            alt=""
        >

        <img
            id="interaction-heart"
            src="https://raw.githubusercontent.com/ngonguyenminhhai-wq/Sound-effect/main/background-remover-1791003659354.png"
            alt=""
        >

    </div>


    <div id="hint">
        WASD: MOVE &nbsp;&nbsp; E / SPACE: INTERACT
    </div>


    <div id="dialogue">

        <div id="speaker">
            OBJECT
        </div>

        <div id="text"></div>

    </div>


    <div id="transition">
        ROOM 2
    </div>

</div>


<script>


/* =========================================================
   SETTINGS
   ========================================================= */

const SOUL_SIZE = 40;

const SPEED = 4;


/* =========================================================
   ELEMENTS
   ========================================================= */

const game =
    document.getElementById("game");

const room =
    document.getElementById("room");

const player =
    document.getElementById("player");

const interactionHeart =
    document.getElementById("interaction-heart");

const roomName =
    document.getElementById("room-name");

const dialogue =
    document.getElementById("dialogue");

const speaker =
    document.getElementById("speaker");

const textBox =
    document.getElementById("text");

const transition =
    document.getElementById("transition");


/* =========================================================
   ROOM DATA
   ========================================================= */

const rooms = {

    room1: {

        name: "ROOM 1",

        startX: 100,

        startY: 150,

        objects: [

            {
                x: 450,
                y: 250,

                width: 120,
                height: 120,

                name: "BOX",

                dialogue: [
                    "You found a strange box.",
                    "It doesn't seem to do anything."
                ]
            }

        ]

    },


    room2: {

        name: "ROOM 2",

        startX: 100,

        startY: 150,

        objects: [

            {
                x: 300,
                y: 220,

                width: 120,
                height: 120,

                name: "OLD BOX",

                dialogue: [
                    "This box looks older.",
                    "There is something written on it."
                ]
            },


            {
                x: 600,
                y: 400,

                width: 120,
                height: 120,

                name: "TABLE",

                dialogue: [
                    "It's an old table.",
                    "There is nothing on it."
                ]
            }

        ]

    }

};


/* =========================================================
   CURRENT ROOM
   ========================================================= */

let currentRoom = "room1";


/* =========================================================
   PLAYER POSITION
   ========================================================= */

let playerX = 100;

let playerY = 150;


/* =========================================================
   KEY STATE
   ========================================================= */

const keys = {};


/* =========================================================
   OBJECT ELEMENTS
   ========================================================= */

let objectElements = [];


/* =========================================================
   DOOR ELEMENT
   ========================================================= */

let door = null;


/* =========================================================
   GAME STATE
   ========================================================= */

let talking = false;

let dialogueIndex = 0;

let currentDialogue = [];


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        const key =
            event.key.toLowerCase();

        keys[key] = true;


        if (event.key === " ") {

            event.preventDefault();

        }


        if (
            key === "e" ||
            event.key === " "
        ) {

            if (talking) {

                advanceDialogue();

            } else {

                interact();

            }

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   LOAD ROOM
   ========================================================= */

function loadRoom(roomID) {

    currentRoom = roomID;

    const data =
        rooms[roomID];


    /*
       Delete old objects.
    */

    objectElements.forEach(
        function(element) {

            element.remove();

        }
    );

    objectElements = [];


    /*
       Delete old door.
    */

    if (door) {

        door.remove();

        door = null;

    }


    /*
       Room name.
    */

    roomName.textContent =
        data.name;


    /*
       Create objects.
    */

    data.objects.forEach(
        function(objectData) {

            const element =
                document.createElement("div");

            element.className =
                "object";


            element.style.left =
                objectData.x + "px";

            element.style.top =
                objectData.y + "px";

            element.style.width =
                objectData.width + "px";

            element.style.height =
                objectData.height + "px";


            room.appendChild(element);

            objectElements.push(element);

        }
    );


    /*
       Create the door.

       It sits in the bottom wall.
    */

    door =
        document.createElement("div");

    door.className =
        "door";


    /*
       Center the door.
    */

    door.style.left =
        (
            room.clientWidth / 2 -
            45
        ) + "px";


    /*
       Put the door directly against
       the bottom wall.
    */

    door.style.top =
        (
            room.clientHeight - 10
        ) + "px";


    const doorLabel =
        document.createElement("div");

    doorLabel.className =
        "door-label";

    doorLabel.textContent =
        roomID === "room1"
            ? "TO ROOM 2"
            : "TO ROOM 1";


    door.appendChild(doorLabel);

    room.appendChild(door);


    /*
       Starting position.
    */

    playerX =
        data.startX;

    playerY =
        data.startY;


    updatePlayer();

}


/* =========================================================
   PLAYER POSITION
   ========================================================= */

function updatePlayer() {

    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";

}


/* =========================================================
   COLLISION RECTANGLE
   ========================================================= */

function playerRect(x, y) {

    return {

        left: x,

        right:
            x + SOUL_SIZE,

        top: y,

        bottom:
            y + SOUL_SIZE

    };

}


/* =========================================================
   OBJECT RECTANGLE
   ========================================================= */

function objectRect(element) {

    return {

        left:
            element.offsetLeft,

        right:
            element.offsetLeft +
            element.offsetWidth,

        top:
            element.offsetTop,

        bottom:
            element.offsetTop +
            element.offsetHeight

    };

}


/* =========================================================
   RECTANGLE COLLISION
   ========================================================= */

function collides(a, b) {

    return (

        a.left < b.right &&

        a.right > b.left &&

        a.top < b.bottom &&

        a.bottom > b.top

    );

}


/* =========================================================
   CHECK OBJECT COLLISION
   ========================================================= */

function hitsObject(x, y) {

    const p =
        playerRect(x, y);


    for (
        const element
        of objectElements
    ) {

        const o =
            objectRect(element);


        if (
            collides(p, o)
        ) {

            return true;

        }

    }


    return false;

}


/* =========================================================
   ROOM BOUNDARY
   ========================================================= */

function insideRoom(x, y) {

    /*
       6 = room border thickness.
    */

    const border = 6;


    if (x < border) {

        return false;

    }


    if (y < border) {

        return false;

    }


    if (
        x + SOUL_SIZE >
        room.clientWidth - border
    ) {

        return false;

    }


    /*
       Leave a small opening at the bottom
       for the door.

       The door itself is the only place
       where the player can reach the wall.
    */

    const doorLeft =
        room.clientWidth / 2 - 45;

    const doorRight =
        room.clientWidth / 2 + 45;


    const nearDoor =
        x + SOUL_SIZE > doorLeft &&
        x < doorRight &&
        y + SOUL_SIZE >
        room.clientHeight - 30;


    if (
        y + SOUL_SIZE >
        room.clientHeight - border &&
        !nearDoor
    ) {

        return false;

    }


    /*
       Normal bottom boundary.
    */

    if (
        y + SOUL_SIZE >
        room.clientHeight
    ) {

        return false;

    }


    return true;

}


/* =========================================================
   CAN MOVE
   ========================================================= */

function canMove(x, y) {

    if (
        !insideRoom(x, y)
    ) {

        return false;

    }


    if (
        hitsObject(x, y)
    ) {

        return false;

    }


    return true;

}


/* =========================================================
   MOVEMENT
   ========================================================= */

function updateMovement() {

    if (talking) {

        return;

    }


    let nextX =
        playerX;

    let nextY =
        playerY;


    /*
       Horizontal.
    */

    if (keys["a"]) {

        nextX -= SPEED;

    }

    if (keys["d"]) {

        nextX += SPEED;

    }


    /*
       Only change X if it doesn't collide.
    */

    if (
        canMove(
            nextX,
            playerY
        )
    ) {

        playerX =
            nextX;

    }


    /*
       Vertical.
    */

    if (keys["w"]) {

        nextY -= SPEED;

    }

    if (keys["s"]) {

        nextY += SPEED;

    }


    /*
       Only change Y if it doesn't collide.
    */

    if (
        canMove(
            playerX,
            nextY
        )
    ) {

        playerY =
            nextY;

    }


    updatePlayer();

}


/* =========================================================
   OBJECT DISTANCE
   ========================================================= */

function distanceToObject(element) {

    const playerCenterX =
        playerX +
        SOUL_SIZE / 2;

    const playerCenterY =
        playerY +
        SOUL_SIZE / 2;


    const objectCenterX =
        element.offsetLeft +
        element.offsetWidth / 2;

    const objectCenterY =
        element.offsetTop +
        element.offsetHeight / 2;


    const dx =
        playerCenterX -
        objectCenterX;

    const dy =
        playerCenterY -
        objectCenterY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   NEAREST OBJECT
   ========================================================= */

function nearestObject() {

    let nearest = null;

    let nearestDistance =
        Infinity;


    objectElements.forEach(
        function(element, index) {

            const distance =
                distanceToObject(
                    element
                );


            if (
                distance <
                nearestDistance
            ) {

                nearestDistance =
                    distance;

                nearest = {

                    element:
                        element,

                    data:
                        rooms[
                            currentRoom
                        ].objects[index]

                };

            }

        }
    );


    return nearest;

}


/* =========================================================
   DOOR DISTANCE
   ========================================================= */

function distanceToDoor() {

    if (!door) {

        return Infinity;

    }


    const playerCenterX =
        playerX +
        SOUL_SIZE / 2;

    const playerCenterY =
        playerY +
        SOUL_SIZE / 2;


    const doorCenterX =
        door.offsetLeft +
        door.offsetWidth / 2;

    const doorCenterY =
        door.offsetTop +
        door.offsetHeight / 2;


    const dx =
        playerCenterX -
        doorCenterX;

    const dy =
        playerCenterY -
        doorCenterY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =========================================================
   INTERACTION INDICATOR
   ========================================================= */

function updateInteraction() {

    if (talking) {

        interactionHeart.style.display =
            "none";

        return;

    }


    const nearest =
        nearestObject();


    /*
       Object gets priority.
    */

    if (
        nearest &&
        distanceToObject(
            nearest.element
        ) < 110
    ) {

        interactionHeart.style.display =
            "block";


        interactionHeart.style.left =
            (
                nearest.element.offsetLeft +
                nearest.element.offsetWidth / 2 -
                12
            ) + "px";


        interactionHeart.style.top =
            (
                nearest.element.offsetTop -
                30
            ) + "px";


        return;

    }


    /*
       Door.
    */

    if (
        distanceToDoor() < 100
    ) {

        interactionHeart.style.display =
            "block";


        interactionHeart.style.left =
            (
                door.offsetLeft +
                door.offsetWidth / 2 -
                12
            ) + "px";


        interactionHeart.style.top =
            (
                door.offsetTop -
                32
            ) + "px";


        return;

    }


    interactionHeart.style.display =
        "none";

}


/* =========================================================
   INTERACT
   ========================================================= */

function interact() {

    /*
       Check objects first.
    */

    const nearest =
        nearestObject();


    if (
        nearest &&
        distanceToObject(
            nearest.element
        ) < 110
    ) {

        startDialogue(
            nearest.data.name,
            nearest.data.dialogue
        );

        return;

    }


    /*
       Check door.
    */

    if (
        distanceToDoor() < 100
    ) {

        changeRoom();

    }

}


/* =========================================================
   START DIALOGUE
   ========================================================= */

function startDialogue(
    objectName,
    lines
) {

    talking = true;

    dialogueIndex = 0;

    currentDialogue =
        lines;


    speaker.textContent =
        objectName;


    dialogue.style.display =
        "block";


    interactionHeart.style.display =
        "none";


    showDialogue();

}


/* =========================================================
   SHOW DIALOGUE
   ========================================================= */

function showDialogue() {

    textBox.textContent =
        currentDialogue[
            dialogueIndex
        ];

}


/* =========================================================
   ADVANCE DIALOGUE
   ========================================================= */

function advanceDialogue() {

    dialogueIndex++;


    if (
        dialogueIndex >=
        currentDialogue.length
    ) {

        closeDialogue();

        return;

    }


    showDialogue();

}


/* =========================================================
   CLOSE DIALOGUE
   ========================================================= */

function closeDialogue() {

    talking = false;

    dialogue.style.display =
        "none";

}


/* =========================================================
   DIALOGUE CLICK
   ========================================================= */

dialogue.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();


        if (talking) {

            advanceDialogue();

        }

    }
);


/* =========================================================
   CHANGE ROOM
   ========================================================= */

function changeRoom() {

    const nextRoom =
        currentRoom === "room1"
            ? "room2"
            : "room1";


    transition.textContent =
        rooms[nextRoom].name;


    transition.style.display =
        "block";


    setTimeout(
        function() {

            transition.style.display =
                "none";

            loadRoom(nextRoom);

        },
        250
    );

}


/* =========================================================
   GAME LOOP
   ========================================================= */

function gameLoop() {

    updateMovement();

    updateInteraction();

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   START
   ========================================================= */

loadRoom("room1");

gameLoop();

</script>

</body>
</html>
