<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Re:Zero Interactive</title>

<style>
@font-face {
    font-family: "8BitOperator";
    src: url("https://deltarune.com/assets/fonts/8bitOperatorPlus-Bold.woff")
         format("woff");
    font-weight: normal;
    font-style: normal;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: black;
    color: white;
    font-family: "8BitOperator", monospace;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 5vh 0;
    overflow-y: auto;
}

#game {
    width: 100%;
    display: flex;
    justify-content: center;
}


/* =========================================================
   NORMAL DIALOGUE BOX
========================================================= */

.utbox {
    width: 75vw;
    min-width: 700px;
    min-height: 320px;

   border: 10px solid red;

    padding: 45px;

    cursor: pointer;
}

.dialogue {
    width: 100%;

    padding-left: 4%;
    padding-right: 4%;

    white-space: pre-wrap;

    font-size: 32px;
    line-height: 1.45;
}


/* =========================================================
   PLAIN NARRATION BOX
========================================================= */

.narration-box {
    width: 75vw;
    min-width: 700px;
    height: 320px;

    border: 4px solid white;

    padding: 8px 10px;

    margin: 0;

    cursor: pointer;

    box-sizing: border-box;

    display: block;
}

.narration-box .typed-text {
    display: block;

    width: 100%;

    margin: 0;
    padding: 0;

    white-space: pre-wrap;
    overflow-wrap: break-word;

    text-align: left;

    font-size: 32px;
    line-height: 1.45;
}
/* =========================================================
   CHOICE SCENE
========================================================= */

.choice-scene {
    width: 75vw;
    min-width: 700px;
}


/* =========================================================
   QUESTION BOX
========================================================= */

.choice-question-box {
    width: 100%;
    min-height: 180px;

    margin-bottom: 8px;
}


/* =========================================================
   CHOICE BOX
========================================================= */

.choice-box {
    width: 100%;
    min-height: 260px;
    height: auto;

    padding: 45px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: default;
}


/* =========================================================
   CHOICE GRID
========================================================= */

.choice-box .choices {
    position: relative;

    width: 100%;
    min-height: 220px;
    height: auto;

    margin: 0;
    padding: 0;
}


/* =========================================================
   INDIVIDUAL CHOICE
========================================================= */

.choice {
    position: absolute;

    width: auto;
    max-width: 42%;

    margin: 0;
    padding: 0 0 0 30px;

    border: none;
    outline: none;

    appearance: none;
    -webkit-appearance: none;

    background: transparent;

    color: white;

    font-family: "8BitOperator", monospace;
    font-size: 32px;
    font-weight: normal;

    line-height: 1.3;

    text-align: left;

    cursor: pointer;

    white-space: normal;
    overflow-wrap: break-word;
}

.choice:hover {
    color: yellow;
}


/* =========================================================
   FOUR DELTARUNE POSITIONS
========================================================= */

.choice.position-top {
    left: 50%;
    top: 0;

    transform: translateX(-50%);
}

.choice.position-left {
    left: 0;
    top: 50%;

    transform: translateY(-50%);
}

.choice.position-right {
    right: 0;
    top: 50%;

    transform: translateY(-50%);
}

.choice.position-bottom {
    left: 50%;
    bottom: 0;

    transform: translateX(-50%);
}

.choice.position-center {
    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);
}


/* =========================================================
   HEART
========================================================= */

.choice-heart {
    position: absolute;

    left: 0;
    top: 7px;

    width: 18px;
    height: 18px;

    object-fit: contain;
    image-rendering: pixelated;

    visibility: hidden;

    background: transparent;
    border: none;
}

.choice:hover .choice-heart {
    visibility: visible;
}


/* =========================================================
   LONG / FALLBACK CHOICES
========================================================= */

.choice-box .choices.vertical {
    position: static;

    height: auto;

    display: flex;
    flex-direction: column;

    justify-content: center;
}

.choice-box .choices.vertical .choice {
    position: relative;

    left: auto;
    right: auto;
    top: auto;
    bottom: auto;

    transform: none;

    width: 100%;
    max-width: none;

    margin-bottom: 18px;
}

.choice-box .choices.vertical .choice:last-child {
    margin-bottom: 0;
}


/* =========================================================
   DISABLED CHOICES
========================================================= */

.choice.disabled {
    pointer-events: none;
}

.choice:disabled {
    opacity: 1;
}


/* =========================================================
   PORTRAIT DIALOGUE
========================================================= */

.portrait-box {
    display: flex;

    align-items: flex-start;

    width: 100%;

    min-height: 220px;

    padding: 0;
    margin: 0;
}

.portrait {
    width: 150px;
    height: 150px;

    flex-shrink: 0;

    object-fit: contain;

    image-rendering: pixelated;

    margin: 0 30px 0 0;
}

.portrait-dialogue {
    flex: 1;

    min-width: 0;

    white-space: pre-wrap;

    font-size: 32px;
    line-height: 1.45;

    margin: -7px 0 0 0;
    padding: 0;
}


/* =========================================================
   WATCH SCREEN
========================================================= */

.youtube-link {
    color: white;
    text-decoration: underline;
}

.youtube-link:hover {
    color: yellow;
}

.watch-box {
    cursor: default;
}

.skip-watch {
    display: block;

    margin-top: 35px;
    margin-left: 4%;

    padding: 0;

    border: none;
    background: transparent;

    color: white;

    font-family: "8BitOperator", monospace;
    font-size: 24px;

    cursor: pointer;

    text-align: left;
}

.skip-watch:hover {
    color: yellow;
}


/* =========================================================
   OTHER
========================================================= */

.red {
    color: red;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 760px) {

    body {
        padding: 3vh 0;
    }

    .utbox,
    .choice-scene,
    .narration-box {
        width: 94vw;
        min-width: 0;
    }

    .utbox {
        padding: 28px;
    }

    .dialogue,
    .portrait-dialogue,
    .narration-box .typed-text {
        font-size: 24px;
    }

    .choice-box {
        padding: 28px;
        min-height: 210px;
    }

    .choice-box .choices {
        min-height: 170px;
        height: auto;
    }

    .choice {
        font-size: 24px;
        padding-left: 26px;
        max-width: 42%;
    }

    .choice-heart {
        width: 16px;
        height: 16px;
        top: 5px;
    }

    .portrait {
        width: 112px;
        height: 112px;
        margin-right: 20px;
    }

    .portrait-box {
        min-height: 160px;
    }

    .choice-question-box,
    .choice-box {
        min-height: 150px;
    }

    .skip-watch {
        font-size: 20px;
        margin-left: 4%;
    }

   .narration-box {
    height: 260px;
    padding: 6px 8px;
}
}
</style>
</head>

<body>

<div id="game"></div>

<script>

const game = document.getElementById("game");

const TEXT_SPEED = 30;


/* =========================================================
   DELTARUNE SOUL
========================================================= */

const HEART_IMAGE =
    "https://raw.githubusercontent.com/ngonguyenminhhai-wq/Sound-effect/main/heart-removebg-preview.png";


/* =========================================================
   MUSIC
========================================================= */

const MUSIC_URL =
    "https://cdn.jsdelivr.net/gh/ngonguyenminhhai-wq/Another-him-theme@main/Toby%20Fox%20-%20ANOTHER%20HIM.mp3";

let music = null;

function startMusic() {

    if (!MUSIC_URL) {
        return;
    }

    try {

        if (!music) {

            music = new Audio(MUSIC_URL);

            music.loop = true;

            music.volume = 0.5;
        }

        music.play().catch(function(error) {

            console.log(
                "Music could not start:",
                error
            );

        });

    } catch (error) {

        console.log(
            "Music error:",
            error
        );

    }
}

function stopMusic() {

    if (!music) {
        return;
    }

    music.pause();

    music.currentTime = 0;
}


/* =========================================================
   DELTARUNE MENU SOUNDS
========================================================= */

const MENU_MOVE_SOUND =
    "https://raw.githubusercontent.com/ngonguyenminhhai-wq/Sound-effect/main/snd_menumove.wav";

const MENU_SELECT_SOUND =
    "https://raw.githubusercontent.com/ngonguyenminhhai-wq/Sound-effect/main/snd_select.wav";

const GREAT_SHINE_SOUND =
    "https://raw.githubusercontent.com/ngonguyenminhhai-wq/Sound-effect/main/snd_great_shine.ogg";

let greatShineAudio = null;

let menuMoveAudio = null;
let menuSelectAudio = null;


/* =========================================================
   CHOICE SOUND FALLBACK
========================================================= */

function playFallbackMenuMoveSound() {

    const context =
        getAudioContext();

    if (!context) {
        return;
    }

    try {

        const oscillator =
            context.createOscillator();

        const gain =
            context.createGain();

        oscillator.type =
            "square";

        oscillator.frequency.setValueAtTime(
            660,
            context.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            880,
            context.currentTime + 0.035
        );

        gain.gain.setValueAtTime(
            0.045,
            context.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            context.currentTime + 0.055
        );

        oscillator.connect(gain);
        gain.connect(context.destination);

        oscillator.start();

        oscillator.stop(
            context.currentTime + 0.055
        );

    } catch (error) {

        console.log(
            "Fallback menu move sound error:",
            error
        );

    }
}


function playFallbackMenuSelectSound() {

    const context =
        getAudioContext();

    if (!context) {
        return;
    }

    try {

        const oscillator =
            context.createOscillator();

        const gain =
            context.createGain();

        oscillator.type =
            "square";

        oscillator.frequency.setValueAtTime(
            440,
            context.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            660,
            context.currentTime + 0.045
        );

        gain.gain.setValueAtTime(
            0.055,
            context.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            context.currentTime + 0.075
        );

        oscillator.connect(gain);
        gain.connect(context.destination);

        oscillator.start();

        oscillator.stop(
            context.currentTime + 0.075
        );

    } catch (error) {

        console.log(
            "Fallback menu select sound error:",
            error
        );

    }
}


/* =========================================================
   PLAY MENU MOVE
========================================================= */

function playMenuMoveSound() {

    try {

        if (!menuMoveAudio) {

            menuMoveAudio =
                new Audio(
                    MENU_MOVE_SOUND
                );

            menuMoveAudio.volume = 0.45;

            menuMoveAudio.addEventListener(
                "error",
                function() {

                    playFallbackMenuMoveSound();

                },
                {
                    once: true
                }
            );
        }

        menuMoveAudio.currentTime = 0;

        const playPromise =
            menuMoveAudio.play();

        if (playPromise) {

            playPromise.catch(
                function() {

                    playFallbackMenuMoveSound();

                }
            );
        }

    } catch (error) {

        playFallbackMenuMoveSound();

    }
}


/* =========================================================
   PLAY MENU SELECT
========================================================= */

function playMenuSelectSound() {

    try {

        if (!menuSelectAudio) {

            menuSelectAudio =
                new Audio(
                    MENU_SELECT_SOUND
                );

            menuSelectAudio.volume = 0.5;

            menuSelectAudio.addEventListener(
                "error",
                function() {

                    playFallbackMenuSelectSound();

                },
                {
                    once: true
                }
            );
        }

        menuSelectAudio.currentTime = 0;

        const playPromise =
            menuSelectAudio.play();

        if (playPromise) {

            playPromise.catch(
                function() {

                    playFallbackMenuSelectSound();

                }
            );
        }

    } catch (error) {

        playFallbackMenuSelectSound();

    }
}


function playGreatShineSound() {

    try {

        if (!greatShineAudio) {

            greatShineAudio =
                new Audio(
                    GREAT_SHINE_SOUND
                );

            greatShineAudio.volume = 0.7;
        }

        greatShineAudio.currentTime = 0;

        const playPromise =
            greatShineAudio.play();

        if (playPromise) {

            playPromise.catch(
                function(error) {

                    console.log(
                        "Great shine sound could not play:",
                        error
                    );

                }
            );
        }

    } catch (error) {

        console.log(
            "Great shine sound error:",
            error
        );

    }
}


/* =========================================================
   VOICE BLIPS
========================================================= */

let audioContext = null;

function getAudioContext() {

    if (!audioContext) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) {
            return null;
        }

        audioContext =
            new AudioContext();
    }

    if (audioContext.state === "suspended") {

        audioContext.resume().catch(
            function() {}
        );
    }

    return audioContext;
}


function playVoiceBlip(character) {

    if (
        character === " " ||
        character === "\n" ||
        character === "\r" ||
        character === "\t"
    ) {
        return;
    }

    if (
        ".,!?…:;\"'()[]{}—–-".includes(
            character
        )
    ) {
        return;
    }

    const context =
        getAudioContext();

    if (!context) {
        return;
    }

    try {

        const oscillator =
            context.createOscillator();

        const gain =
            context.createGain();

        oscillator.type = "square";

        oscillator.frequency.value =
            150 + Math.random() * 35;

        gain.gain.setValueAtTime(
            0.035,
            context.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            context.currentTime + 0.045
        );

        oscillator.connect(gain);

        gain.connect(
            context.destination
        );

        oscillator.start();

        oscillator.stop(
            context.currentTime + 0.045
        );

    } catch (error) {

        console.log(
            "Voice blip error:",
            error
        );

    }
}


/* =========================================================
   TYPING
========================================================= */

let typingTimer = null;

let isTyping = false;

let currentFullText = "";

let currentNext = null;


function stopTyping() {

    if (typingTimer !== null) {

        clearInterval(
            typingTimer
        );

        typingTimer = null;
    }
}


/* =========================================================
   NORMAL DIALOGUE
========================================================= */

function showDialogue(
    text,
    next,
    startMusicOnAdvance = false,
    stopMusicOnAdvance = false,
    playGreatShineOnFinish = false
) {

    stopTyping();

    game.innerHTML = `
        <div class="utbox">
            <div class="dialogue">
                <span class="typed-text"></span>
            </div>
        </div>
    `;

    const box =
        game.querySelector(
            ".utbox"
        );

    const typedText =
        game.querySelector(
            ".typed-text"
        );


    currentFullText =
        "* " + text;

    currentNext =
        next;

    isTyping =
        true;

    let index = 0;


    typingTimer =
        setInterval(function() {

            const character =
                currentFullText[index];

            typedText.textContent +=
                character;

            playVoiceBlip(
                character
            );

            index++;

            if (
                index >=
                currentFullText.length
            ) {

                stopTyping();

                isTyping =
                    false;

                if (playGreatShineOnFinish) {
                    playGreatShineSound();
                }
            }

        }, TEXT_SPEED);


    box.addEventListener(
        "click",
        function() {

            if (isTyping) {

                stopTyping();

                typedText.textContent =
                    currentFullText;

                isTyping =
                    false;

                if (playGreatShineOnFinish) {
                    playGreatShineSound();
                }

                return;
            }


            if (
                stopMusicOnAdvance
            ) {

                stopMusic();
            }


            if (
                startMusicOnAdvance
            ) {

                startMusic();
            }


            if (currentNext) {

                currentNext();

            }

        }
    );
}


/* =========================================================
   RED DIALOGUE
========================================================= */

function showRedDialogue(
    text,
    next,
    startMusicOnAdvance = false,
    stopMusicOnAdvance = false
) {

    stopTyping();

    game.innerHTML = `
        <div class="utbox">
            <div class="dialogue red">
                <span class="typed-text"></span>
            </div>
        </div>
    `;

    const box =
        game.querySelector(
            ".utbox"
        );

    const typedText =
        game.querySelector(
            ".typed-text"
        );


    currentFullText =
        "* " + text;

    currentNext =
        next;

    isTyping =
        true;

    let index = 0;


    typingTimer =
        setInterval(function() {

            const character =
                currentFullText[index];

            typedText.textContent +=
                character;

            playVoiceBlip(
                character
            );

            index++;

            if (
                index >=
                currentFullText.length
            ) {

                stopTyping();

                isTyping =
                    false;
            }

        }, TEXT_SPEED);


    box.addEventListener(
        "click",
        function() {

            if (isTyping) {

                stopTyping();

                typedText.textContent =
                    currentFullText;

                isTyping =
                    false;

                return;
            }


            if (
                stopMusicOnAdvance
            ) {

                stopMusic();
            }


            if (
                startMusicOnAdvance
            ) {

                startMusic();
            }


            if (currentNext) {

                currentNext();

            }

        }
    );
}


/* =========================================================
   CHOICES
========================================================= */

function showChoices(
    question,
    choices,
    onChoice
) {

    stopTyping();

    if (question) {

        showDialogue(
            question,
            function() {

                showChoiceBox(
                    choices,
                    onChoice
                );

            }
        );

    } else {

        showChoiceBox(
            choices,
            onChoice
        );

    }
}


/* =========================================================
   CHOICE POSITION
========================================================= */

function getChoicePosition(
    index,
    count
) {

    if (count === 1) {
        return "center";
    }

    if (count === 2) {

        if (index === 0) {
            return "left";
        }

        return "right";
    }

    if (count === 3) {

        if (index === 0) {
            return "top";
        }

        if (index === 1) {
            return "left";
        }

        return "right";
    }

    if (count === 4) {

        if (index === 0) {
            return "top";
        }

        if (index === 1) {
            return "left";
        }

        if (index === 2) {
            return "right";
        }

        return "bottom";
    }

    return "vertical";
}


/* =========================================================
   ACTUAL CHOICE BOX
========================================================= */

function showChoiceBox(
    choices,
    onChoice
) {

    stopTyping();

    game.innerHTML = `
        <div class="choice-scene">

            <div class="utbox choice-box">

                <div class="choices"></div>

            </div>

        </div>
    `;

    const box =
        game.querySelector(
            ".choice-box"
        );

    const choicesContainer =
        game.querySelector(
            ".choices"
        );

    const buttons = [];

    const count =
        choices.length;


    if (count > 4) {

        choicesContainer.classList.add(
            "vertical"
        );

    }


    choices.forEach(
        function(choiceText, index) {

            const button =
                document.createElement(
                    "button"
                );

            const position =
                getChoicePosition(
                    index,
                    count
                );


            button.className =
                "choice disabled position-" +
                position;


            button.innerHTML = `
                <img
                    class="choice-heart"
                    src="${HEART_IMAGE}"
                    alt=""
                >

                <span class="choice-text"></span>
            `;


            button.addEventListener(
                "mouseenter",
                function() {

                    if (
                        button.classList.contains(
                            "disabled"
                        )
                    ) {

                        return;

                    }

                    playMenuMoveSound();

                }
            );


            button.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();


                    if (
                        button.classList.contains(
                            "disabled"
                        )
                    ) {

                        return;

                    }


                    playMenuSelectSound();


                    onChoice(index);

                }
            );


            choicesContainer.appendChild(
                button
            );


            buttons.push({

                button:
                    button,

                text:
                    choiceText,

                textElement:
                    button.querySelector(
                        ".choice-text"
                    )

            });

        }
    );


    function finishChoices() {

        buttons.forEach(
            function(item) {

                item.textElement.textContent =
                    item.text;

                item.button.classList.remove(
                    "disabled"
                );

            }
        );

        isTyping =
            false;
    }


    function typeChoiceOptions() {

        let choiceIndex = 0;


        function typeNextChoice() {

            if (
                choiceIndex >=
                buttons.length
            ) {

                finishChoices();

                return;

            }


            const item =
                buttons[choiceIndex];

            let letterIndex = 0;

            isTyping =
                true;


            typingTimer =
                setInterval(
                    function() {

                        const character =
                            item.text[
                                letterIndex
                            ];


                        item.textElement.textContent +=
                            character;


                        playVoiceBlip(
                            character
                        );


                        letterIndex++;


                        if (
                            letterIndex >=
                            item.text.length
                        ) {

                            stopTyping();

                            choiceIndex++;

                            typeNextChoice();

                        }

                    },
                    TEXT_SPEED
                );
        }


        typeNextChoice();

    }


    typeChoiceOptions();


    box.addEventListener(
        "click",
        function() {

            if (!isTyping) {
                return;
            }

            stopTyping();

            finishChoices();

        }
    );

}


/* =========================================================
   NARRATION
========================================================= */

function showNarration(text, next) {

    stopTyping();

    game.innerHTML = `
        <div class="narration-box">
            <span class="typed-text"></span>
        </div>
    `;

    const box =
        game.querySelector(
            ".narration-box"
        );

    const typedText =
        game.querySelector(
            ".typed-text"
        );

    currentFullText =
        "*" + text;

    currentNext =
        next;

    isTyping =
        true;

    let index = 0;

    typingTimer =
        setInterval(function() {

            const character =
                currentFullText[index];

            typedText.textContent +=
                character;

            playVoiceBlip(
                character
            );

            index++;

            if (
                index >=
                currentFullText.length
            ) {

                stopTyping();

                isTyping =
                    false;
            }

        }, TEXT_SPEED);


    box.addEventListener(
        "click",
        function() {

            if (isTyping) {

                stopTyping();

                typedText.textContent =
                    currentFullText;

                isTyping =
                    false;

                return;
            }

            if (currentNext) {

/* =========================================================
   SUBARU PORTRAIT DIALOGUE
========================================================= */

function showSubaruDialogue(
    text,
    next,
    startMusicOnAdvance = false,
    stopMusicOnAdvance = false
) {

    stopTyping();

    game.innerHTML = `
        <div class="utbox">

            <div class="portrait-box">

                <img
                    class="portrait"
                    src="https://i.postimg.cc/TP6PZv0B/image.png"
                    alt="Subaru"
                >

                <div class="portrait-dialogue">
                    <span class="typed-text"></span>
                </div>

            </div>

        </div>
    `;


    const box =
        game.querySelector(
            ".utbox"
        );


    const typedText =
        game.querySelector(
            ".typed-text"
        );


    currentFullText =
        "* " + text;

    currentNext =
        next;

    isTyping =
        true;

    let index = 0;


    typingTimer =
        setInterval(function() {

            const character =
                currentFullText[index];


            typedText.textContent +=
                character;


            playVoiceBlip(
                character
            );


            index++;


            if (
                index >=
                currentFullText.length
            ) {

                stopTyping();

                isTyping =
                    false;
            }

        }, TEXT_SPEED);


    box.addEventListener(
        "click",
        function() {

            if (isTyping) {

                stopTyping();

                typedText.textContent =
                    currentFullText;

                isTyping =
                    false;

                return;
            }


            if (
                stopMusicOnAdvance
            ) {

                stopMusic();
            }


            if (
                startMusicOnAdvance
            ) {

                startMusic();
            }


            if (currentNext) {

                currentNext();

            }

        }
    );
}
