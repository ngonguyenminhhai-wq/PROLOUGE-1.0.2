<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Test</title>

<style>

@font-face {
    font-family: "8BitOperator";
    src: url("https://deltarune.com/assets/fonts/8bitOperatorPlus-Bold.woff");
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: black;
    color: white;
    font-family: "8BitOperator", monospace;
    overflow: hidden;
}


/* =========================
   GAME
========================= */

#game {

    position: relative;

    width: 100vw;
    height: 100vh;

    background: black;

    overflow: hidden;

    image-rendering: pixelated;
}


/* =========================
   PLAYER
========================= */

#player {

    position: absolute;

    width: 32px;
    height: 32px;

    object-fit: contain;

    image-rendering: pixelated;

    z-index: 10;
}


/* =========================
   INTERACTABLE OBJECT
========================= */

#object {

    position: absolute;

    width: 100px;
    height: 100px;

    left: 500px;
    top: 250px;

    background: #222;

    border: 4px solid white;

    z-index: 2;
}


/* =========================
   INTERACTION HEART
========================= */

#interaction-heart {

    position: absolute;

    width: 20px;
    height: 20px;

    object-fit: contain;

    image-rendering: pixelated;

    display: none;

    pointer-events: none;

    z-index: 20;
}


/* =========================
   CONTROLS
========================= */

#hint {

    position: absolute;

    top: 20px;
    left: 20px;

    color: #aaa;

    font-size: 14px;

    z-index: 50;
}


/* =========================
   DIALOGUE BOX
========================= */

#dialogue {

    position: absolute;

    left: 50%;
    bottom: 30px;

    transform: translateX(-50%);

    width: 80%;

    min-height: 150px;

    padding: 25px 30px;

    background: black;

    border: 4px solid white;

    display: none;

    z-index: 100;

    cursor: pointer;
}


/* SPEAKER */

#speaker {

    font-size: 20px;

    margin-bottom: 18px;
}


/* TEXT */

#text {

    font-size: 20px;

    line-height: 1.5;

}

</style>
</head>


<body>

<div id="game">


    <!-- CONTROLS -->

    <div id="hint">
        WASD: MOVE &nbsp;&nbsp; E / SPACE: INTERACT
    </div>


    <!-- PLAYER -->

    <img
        id="player"
        src="https://raw.githubusercontent.com/ngonguyenminhhai-wq/Sound-effect/main/heart.png"
        alt=""
    >


    <!-- INTERACTABLE OBJECT -->

    <div id="object"></div>


    <!-- SMALL HEART THAT APPEARS WHEN CLOSE -->

    <img
        id="interaction-heart"
        src="https://raw.githubusercontent.com/ngonguyenminhhai-wq/Sound-effect/main/heart.png"
        alt=""
    >


    <!-- DIALOGUE -->

    <div id="dialogue">

        <div id="speaker">
            OBJECT
        </div>

        <div id="text"></div>

    </div>


</div>


<script>

/* =========================
   ELEMENTS
========================= */

const player =
    document.getElementById("player");

const object =
    document.getElementById("object");

const interactionHeart =
    document.getElementById("interaction-heart");

const dialogue =
    document.getElementById("dialogue");

const textBox =
    document.getElementById("text");

const game =
    document.getElementById("game");


/* =========================
   PLAYER
========================= */

let playerX = 200;
let playerY = 200;

const playerSpeed = 4;

const keys = {};


/* =========================
   DIALOGUE
========================= */

let talking = false;

let dialogueIndex = 0;

const dialogueLines = [

    "You found something.",

    "It's just a strange box.",

    "You don't know what it does."

];


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        keys[event.key.toLowerCase()] = true;


        /* Prevent Space from scrolling */

        if (event.key === " ") {

            event.preventDefault();

        }


        /* INTERACTION */

        if (
            event.key.toLowerCase() === "e" ||
            event.key === " "
        ) {

            if (talking) {

                advanceDialogue();

            } else {

                tryInteract();

            }

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        keys[event.key.toLowerCase()] = false;

    }
);


/* =========================
   MOVEMENT
========================= */

function updateMovement() {

    if (talking) {
        return;
    }


    if (keys["w"]) {
        playerY -= playerSpeed;
    }

    if (keys["s"]) {
        playerY += playerSpeed;
    }

    if (keys["a"]) {
        playerX -= playerSpeed;
    }

    if (keys["d"]) {
        playerX += playerSpeed;
    }


    /* Keep player inside screen */

    const maxX =
        game.clientWidth - player.offsetWidth;

    const maxY =
        game.clientHeight - player.offsetHeight;


    playerX =
        Math.max(
            0,
            Math.min(playerX, maxX)
        );


    playerY =
        Math.max(
            0,
            Math.min(playerY, maxY)
        );


    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";

}


/* =========================
   DISTANCE
========================= */

function getDistance() {

    const playerCenterX =
        playerX + player.offsetWidth / 2;

    const playerCenterY =
        playerY + player.offsetHeight / 2;


    const objectCenterX =
        object.offsetLeft +
        object.offsetWidth / 2;

    const objectCenterY =
        object.offsetTop +
        object.offsetHeight / 2;


    const dx =
        playerCenterX - objectCenterX;

    const dy =
        playerCenterY - objectCenterY;


    return Math.sqrt(
        dx * dx + dy * dy
    );

}


/* =========================
   INTERACTION INDICATOR
========================= */

function updateInteraction() {

    if (talking) {

        interactionHeart.style.display =
            "none";

        return;

    }


    const distance =
        getDistance();


    if (distance < 120) {

        interactionHeart.style.display =
            "block";


        /*
           Put the small heart
           above the object.
        */

        interactionHeart.style.left =
            (
                object.offsetLeft +
                object.offsetWidth / 2 -
                10
            ) + "px";


        interactionHeart.style.top =
            (
                object.offsetTop - 30
            ) + "px";


    } else {

        interactionHeart.style.display =
            "none";

    }

}


/* =========================
   INTERACT
========================= */

function tryInteract() {

    const distance =
        getDistance();


    if (distance < 120) {

        startDialogue();

    }

}


/* =========================
   START DIALOGUE
========================= */

function startDialogue() {

    talking = true;

    dialogueIndex = 0;

    dialogue.style.display =
        "block";

    interactionHeart.style.display =
        "none";

    showDialogueLine();

}


/* =========================
   SHOW DIALOGUE
========================= */

function showDialogueLine() {

    textBox.textContent =
        dialogueLines[dialogueIndex];

}


/* =========================
   ADVANCE
========================= */

function advanceDialogue() {

    dialogueIndex++;


    if (
        dialogueIndex >=
        dialogueLines.length
    ) {

        closeDialogue();

        return;

    }


    showDialogueLine();

}


/* =========================
   CLOSE
========================= */

function closeDialogue() {

    talking = false;

    dialogue.style.display =
        "none";

}


/* =========================
   CLICK DIALOGUE
========================= */

dialogue.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        if (talking) {

            advanceDialogue();

        }

    }
);


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    updateMovement();

    updateInteraction();

    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

</script>

</body>
</html>
