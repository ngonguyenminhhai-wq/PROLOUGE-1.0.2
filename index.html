<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neocities Game Test</title>

<style>
@font-face {
    font-family: "8BitOperator";
    src: url("https://deltarune.com/assets/fonts/8bitOperatorPlus-Bold.woff");
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: black;
    color: white;
    font-family: "8BitOperator", monospace;
    overflow: hidden;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: black;
    overflow: hidden;
}

/* PLAYER */

#player {
    position: absolute;
    width: 64px;
    height: 64px;

    /* TEMPORARY PLAYER */
    background: white;

    left: 200px;
    top: 200px;

    image-rendering: pixelated;

    z-index: 5;
}

/* INTERACTABLE OBJECT */

#object {
    position: absolute;

    width: 100px;
    height: 100px;

    left: 500px;
    top: 250px;

    background: #222;
    border: 4px solid white;

    z-index: 2;
}

/* HEART */

#heart {
    position: absolute;

    width: 22px;
    height: 22px;

    display: none;

    image-rendering: pixelated;

    z-index: 10;

    pointer-events: none;
}

/* DIALOGUE */

#dialogue {
    position: absolute;

    left: 50%;
    bottom: 30px;

    transform: translateX(-50%);

    width: 80%;
    min-height: 150px;

    border: 4px solid white;

    background: black;

    padding: 28px 35px;

    display: none;

    z-index: 100;
}

#speaker {
    font-size: 22px;
    margin-bottom: 18px;
}

#text {
    font-size: 20px;
    line-height: 1.5;
}

#hint {
    position: absolute;

    top: 20px;
    left: 20px;

    font-size: 14px;

    color: #aaa;

    z-index: 20;
}
</style>
</head>

<body>

<div id="game">

    <div id="hint">
        WASD: MOVE &nbsp;&nbsp; E / SPACE: INTERACT
    </div>

    <div id="player"></div>

    <div id="object"></div>

    <img
        id="heart"
        src="https://raw.githubusercontent.com/ngonguyenminhhai-wq/Sound-effect/main/heart.png"
        alt=""
    >

    <div id="dialogue">

        <div id="speaker">
            OBJECT
        </div>

        <div id="text"></div>

    </div>

</div>

<script>

/* =========================
   SETTINGS
========================= */

const player = document.getElementById("player");
const object = document.getElementById("object");
const heart = document.getElementById("heart");

const dialogue = document.getElementById("dialogue");
const speaker = document.getElementById("speaker");
const textBox = document.getElementById("text");

const game = document.getElementById("game");


/* =========================
   PLAYER
========================= */

let playerX = 200;
let playerY = 200;

const playerSpeed = 4;

const keys = {};


/* =========================
   DIALOGUE
========================= */

let talking = false;
let dialogueIndex = 0;

const dialogueLines = [
    "You found something.",
    "It appears to be a strange box.",
    "You don't know what it does."
];


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown", function(event) {

    keys[event.key.toLowerCase()] = true;

    /*
       Prevent the browser from scrolling
       when using Space or arrow keys.
    */

    if (
        event.key === " " ||
        event.key === "ArrowUp" ||
        event.key === "ArrowDown" ||
        event.key === "ArrowLeft" ||
        event.key === "ArrowRight"
    ) {
        event.preventDefault();
    }

    if (
        event.key.toLowerCase() === "e" ||
        event.key === " "
    ) {

        if (talking) {

            advanceDialogue();

        } else {

            tryInteract();

        }

    }

});


document.addEventListener("keyup", function(event) {

    keys[event.key.toLowerCase()] = false;

});


/* =========================
   MOVEMENT
========================= */

function updateMovement() {

    if (talking) {
        return;
    }

    if (keys["w"]) {
        playerY -= playerSpeed;
    }

    if (keys["s"]) {
        playerY += playerSpeed;
    }

    if (keys["a"]) {
        playerX -= playerSpeed;
    }

    if (keys["d"]) {
        playerX += playerSpeed;
    }


    /* Keep player inside game */

    const maxX = game.clientWidth - player.offsetWidth;
    const maxY = game.clientHeight - player.offsetHeight;

    playerX = Math.max(0, Math.min(playerX, maxX));
    playerY = Math.max(0, Math.min(playerY, maxY));


    player.style.left = playerX + "px";
    player.style.top = playerY + "px";
}


/* =========================
   DISTANCE CHECK
========================= */

function getDistance() {

    const playerCenterX =
        playerX + player.offsetWidth / 2;

    const playerCenterY =
        playerY + player.offsetHeight / 2;


    const objectX =
        object.offsetLeft + object.offsetWidth / 2;

    const objectY =
        object.offsetTop + object.offsetHeight / 2;


    const dx = playerCenterX - objectX;
    const dy = playerCenterY - objectY;


    return Math.sqrt(
        dx * dx + dy * dy
    );
}


/* =========================
   INTERACTION RANGE
========================= */

function updateInteraction() {

    if (talking) {

        heart.style.display = "none";
        return;

    }

    const distance = getDistance();

    if (distance < 120) {

        /*
           Put the heart above the player.
        */

        heart.style.display = "block";

        heart.style.left =
            (playerX + 21) + "px";

        heart.style.top =
            (playerY - 30) + "px";

    } else {

        heart.style.display = "none";

    }
}


/* =========================
   INTERACT
========================= */

function tryInteract() {

    const distance = getDistance();

    if (distance < 120) {

        startDialogue();

    }

}


/* =========================
   START DIALOGUE
========================= */

function startDialogue() {

    talking = true;

    dialogueIndex = 0;

    dialogue.style.display = "block";

    showDialogueLine();

}


/* =========================
   SHOW LINE
========================= */

function showDialogueLine() {

    textBox.textContent =
        dialogueLines[dialogueIndex];

}


/* =========================
   ADVANCE
========================= */

function advanceDialogue() {

    dialogueIndex++;


    if (dialogueIndex >= dialogueLines.length) {

        closeDialogue();

        return;

    }


    showDialogueLine();

}


/* =========================
   CLOSE
========================= */

function closeDialogue() {

    talking = false;

    dialogue.style.display = "none";

    heart.style.display = "none";

}


/* =========================
   CLICK DIALOGUE
========================= */

dialogue.addEventListener("click", function(event) {

    event.stopPropagation();

    if (talking) {

        advanceDialogue();

    }

});


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    updateMovement();

    updateInteraction();

    requestAnimationFrame(gameLoop);

}


gameLoop();

</script>

</body>
</html>
